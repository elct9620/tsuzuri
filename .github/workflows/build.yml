name: Build

# Bundles Tsuzuri on each platform with its Bundled Variants, for CI and for a release alike.
# The caller's run must hold the crate-licenses artifact the License Notice is written from.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build; the caller's own when empty.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only pay off when the same tree is rebuilt, and they would fill the cache.
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          echo "version=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Keyed by compiler as well as lockfile: artifacts from another rustc are rebuilt anyway.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: build-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The installer carries each Component's Bundled Variant: the first components.json lists for the platform.
      # Each is restored from the cache unless its pin or the build script changed, or the cache expired.
      - name: Choose the Bundled Variants
        id: bundled
        shell: bash
        run: |
          platform="$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          for name in ffmpeg whisper llama; do
            echo "$name=$(jq -er --arg name "$name" --arg platform "$platform" '.[$name].variants[$platform][0]' components.json)" >> "$GITHUB_OUTPUT"
          done
      - uses: ./.github/actions/build-component
        with:
          component: ffmpeg
          variant: ${{ steps.bundled.outputs.ffmpeg }}
          platform: ${{ steps.bundled.outputs.platform }}
          program: ffmpeg
          version-flag: -version
      - uses: ./.github/actions/build-component
        with:
          component: whisper
          variant: ${{ steps.bundled.outputs.whisper }}
          platform: ${{ steps.bundled.outputs.platform }}
          program: whisper-cli
          version-flag: --version
      - uses: ./.github/actions/build-component
        with:
          component: llama
          variant: ${{ steps.bundled.outputs.llama }}
          platform: ${{ steps.bundled.outputs.platform }}
          program: llama-server
          version-flag: --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-licenses
      # Written after the Bundled Variants are built, whose licenses it carries, and before
      # the webview is bundled, which ships it for the settings to open.
      - name: Write the License Notice
        run: node scripts/licenses.ts crate-licenses.json
      - run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsuzuri-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
      # Kept even when a check fails, so dependencies are not rebuilt on the next run.
      # Tsuzuri's own artifacts and bundles are rebuilt every run, so they are left out.
      - name: Prune what the next run rebuilds anyway
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: src-tauri
        run: |
          rm -rf target/*/incremental target/*/bundle
          find target -maxdepth 3 \( -name 'tsuzuri*' -o -name 'libtsuzuri*' \) -prune -exec rm -rf {} +
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
