name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only pay off when the same tree is rebuilt, and they would fill the cache.
  CARGO_INCREMENTAL: 0

jobs:
  spec:
    runs-on: ubuntu-latest
    env:
      # Pinned by hand: nothing watches a release asset fetched over curl.
      # The digest is pinned alongside the tag because an asset can be replaced.
      SUMI_VERSION: 0.1.0-preview10
      SUMI_SHA256: 8a5749dd80e9ae46e5005f2d14bcd2e69b3fa9537a606df0da97e55300a67efb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sumi
        run: |
          curl -sSL -o "$RUNNER_TEMP/sumi.tar.gz" \
            "https://github.com/elct9620/sumitsubo/releases/download/v$SUMI_VERSION/sumi-$SUMI_VERSION-linux-x86_64.tar.gz"
          echo "$SUMI_SHA256  $RUNNER_TEMP/sumi.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check the source against the specification
        run: sumi verify
      - name: Check the specification is written the way a reference line is
        run: sumi fmt --check

  licenses:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      CARGO_ABOUT_VERSION: 0.9.2
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSL -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Check dependency licenses
        working-directory: src-tauri
        run: cargo deny --all-features check licenses
      - name: Install cargo-about
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl -sSL -o "$RUNNER_TEMP/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # The binaries carry these crates, so their license texts travel with every build.
      - name: Generate third-party license notices
        working-directory: src-tauri
        run: cargo about generate --locked --fail -o ../THIRD-PARTY-LICENSES.html about.hbs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The webview bundles these packages, so their licenses are checked and their texts shipped too.
      - name: Check the webview's licenses and generate their notices
        run: node scripts/webview-licenses.ts THIRD-PARTY-LICENSES-WEBVIEW.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: |
            THIRD-PARTY-LICENSES.html
            THIRD-PARTY-LICENSES-WEBVIEW.html
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the frontend is formatted
        run: pnpm exec prettier --check .
      - run: pnpm test
      - name: Type-check and build
        run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
          echo "version=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Keyed by compiler as well as lockfile: artifacts from another rustc are rebuilt anyway.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      # generate_context! embeds the frontend, which only has to exist for these checks.
      - name: Provide an empty frontend
        run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Kept even when a check fails, so dependencies are not rebuilt on the next run.
      # Tsuzuri's own artifacts and bundles are rebuilt every run, so they are left out.
      - name: Prune what the next run rebuilds anyway
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: src-tauri
        run: |
          rm -rf target/*/incremental target/*/bundle
          find target -maxdepth 3 \( -name 'tsuzuri*' -o -name 'libtsuzuri*' \) -prune -exec rm -rf {} +
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    needs: [spec, licenses, frontend, rust]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          echo "version=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Keyed by compiler as well as lockfile: artifacts from another rustc are rebuilt anyway.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: build-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The installer carries each Component's Bundled Variant: the first components.json lists for the platform.
      # Each is restored from the cache unless its pin or the build script changed, or the cache expired.
      - name: Choose the Bundled Variants
        id: bundled
        shell: bash
        run: |
          platform="$(tr '[:upper:]' '[:lower:]' <<<"$RUNNER_OS")"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          for name in ffmpeg whisper llama; do
            echo "$name=$(jq -er --arg name "$name" --arg platform "$platform" '.[$name].variants[$platform][0]' components.json)" >> "$GITHUB_OUTPUT"
          done
      - uses: ./.github/actions/build-component
        with:
          component: ffmpeg
          variant: ${{ steps.bundled.outputs.ffmpeg }}
          platform: ${{ steps.bundled.outputs.platform }}
          program: ffmpeg
          version-flag: -version
      - uses: ./.github/actions/build-component
        with:
          component: whisper
          variant: ${{ steps.bundled.outputs.whisper }}
          platform: ${{ steps.bundled.outputs.platform }}
          program: whisper-cli
          version-flag: --version
      - uses: ./.github/actions/build-component
        with:
          component: llama
          variant: ${{ steps.bundled.outputs.llama }}
          platform: ${{ steps.bundled.outputs.platform }}
          program: llama-server
          version-flag: --version
      - run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsuzuri-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/
            THIRD-PARTY-LICENSES.html
            THIRD-PARTY-LICENSES-WEBVIEW.html
          if-no-files-found: error
      # Kept even when a check fails, so dependencies are not rebuilt on the next run.
      # Tsuzuri's own artifacts and bundles are rebuilt every run, so they are left out.
      - name: Prune what the next run rebuilds anyway
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: src-tauri
        run: |
          rm -rf target/*/incremental target/*/bundle
          find target -maxdepth 3 \( -name 'tsuzuri*' -o -name 'libtsuzuri*' \) -prune -exec rm -rf {} +
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
