name: CI

on:
  push:
    # main is the trunk: each push there publishes a Preview build; stable carries the releases.
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; every push to a branch is checked to the end,
# so each commit keeps a verdict and a release commit is always bundled. The branch is part of the
# group, so one commit pushed to main and stable is checked on both at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only pay off when the same tree is rebuilt, and they would fill the cache.
  CARGO_INCREMENTAL: 0

jobs:
  spec:
    runs-on: ubuntu-latest
    env:
      # Pinned by hand: nothing watches a release asset fetched over curl.
      # The digest is pinned alongside the tag because an asset can be replaced.
      SUMI_VERSION: 0.1.0-preview10
      SUMI_SHA256: 8a5749dd80e9ae46e5005f2d14bcd2e69b3fa9537a606df0da97e55300a67efb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sumi
        run: |
          curl -sSL -o "$RUNNER_TEMP/sumi.tar.gz" \
            "https://github.com/elct9620/sumitsubo/releases/download/v$SUMI_VERSION/sumi-$SUMI_VERSION-linux-x86_64.tar.gz"
          echo "$SUMI_SHA256  $RUNNER_TEMP/sumi.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/sumi.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check the source against the specification
        run: sumi verify
      - name: Check the specification is written the way a reference line is
        run: sumi fmt --check

  licenses:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      CARGO_ABOUT_VERSION: 0.9.2
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSL -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Check dependency licenses
        working-directory: src-tauri
        run: cargo deny --all-features check licenses
      - name: Install cargo-about
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl -sSL -o "$RUNNER_TEMP/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # The binaries carry these crates, so their license texts travel with every build.
      - name: List the crates' licenses
        working-directory: src-tauri
        run: cargo about generate --locked --fail --format json -o ../crate-licenses.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The webview bundles these packages, so their licenses are checked and their texts shipped too.
      # Bundling lists them, so only what ships is checked.
      - name: Check the webview's licenses and write the License Notice
        run: |
          pnpm exec vite build
          node scripts/licenses.ts crate-licenses.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-licenses
          path: crate-licenses.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the frontend is formatted
        run: pnpm exec prettier --check .
      - run: pnpm test
      - name: Type-check and build
        run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
          echo "version=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Keyed by compiler as well as lockfile: artifacts from another rustc are rebuilt anyway.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ steps.rust.outputs.version }}-
      # generate_context! embeds the frontend, which only has to exist for these checks.
      - name: Provide an empty frontend
        run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Kept even when a check fails, so dependencies are not rebuilt on the next run.
      # Tsuzuri's own artifacts and bundles are rebuilt every run, so they are left out.
      - name: Prune what the next run rebuilds anyway
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: src-tauri
        run: |
          rm -rf target/*/incremental target/*/bundle
          find target -maxdepth 3 \( -name 'tsuzuri*' -o -name 'libtsuzuri*' \) -prune -exec rm -rf {} +
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # A Preview build is numbered past the latest stable release by its build time; the number is
  # written into the build only, never committed.
  preview-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/preview_version.ts
            scripts/signatures.ts
            src-tauri/Cargo.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Number the Preview build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          # Before the first release the package version is the base; any other failure stops here,
          # since a lower base would number the build below the stable release it follows.
          if ! latest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>release-error)"; then
            grep -qx 'release not found' release-error || { cat release-error; exit 1; }
            latest=""
          fi
          version="$(node scripts/preview_version.ts next "$(date -u +%Y%m%d%H%M)" "$RUN" "$latest")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version"

  build:
    needs: [spec, licenses, frontend, rust, preview-version]
    # A skipped preview-version (any push to stable) must not skip the build.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.spec.result == 'success' && needs.licenses.result == 'success' &&
      needs.frontend.result == 'success' && needs.rust.result == 'success' &&
      needs.preview-version.result != 'failure'
    # Only the newest Preview build is published, so the one bundling finishes and only the newest
    # push waits behind it; a push that keeps coming still publishes, and an older one is dropped.
    concurrency:
      group: bundle-${{ github.ref == 'refs/heads/main' && 'preview' || github.sha }}
    uses: ./.github/workflows/build.yml
    with:
      preview-version: ${{ needs.preview-version.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
