name: Release Assets

# Attaches what CI built for a release's commit, so nothing is compiled twice. Rerunning this
# replaces the assets; for a commit CI has not built, run CI on its tag first, then this.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach assets to, such as v0.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  target:
    # A pull request's run never builds a release, and its code is not trusted with write access.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      run-id: ${{ steps.release.outputs.run-id }}
    steps:
      - name: Find the release and the CI run that built it
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml --commit "$sha" -s success \
              --json databaseId -q '.[0].databaseId')"
            if [ -z "$run_id" ]; then
              echo "::error::no successful CI run built $tag ($sha); run CI on $tag first"
              exit 1
            fi
          else
            # release-please tags the commit that carries the new version.
            version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq .content |
              base64 -d | jq -er .version)"
            tag="v$version"
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)" || tagged=""
            if [ "$tagged" != "$RUN_SHA" ]; then
              echo "$RUN_SHA is not the commit $tag is tagged at; nothing to attach"
              exit 0
            fi
            run_id="$RUN_ID"
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json tagName -q .tagName
          { echo "tag=$tag"; echo "run-id=$run_id"; } >> "$GITHUB_OUTPUT"

  attach:
    needs: target
    if: needs.target.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tsuzuri-*
          path: bundles
          run-id: ${{ needs.target.outputs.run-id }}
          github-token: ${{ github.token }}
      # Installers only, so no executable reaches users loose or inside a zip.
      - name: Collect the installers
        run: |
          mkdir assets
          find bundles -type f \( -path '*/nsis/*.exe' -o -path '*/msi/*.msi' -o -path '*/dmg/*.dmg' \
            -o -path '*/deb/*.deb' -o -path '*/rpm/*.rpm' \) -exec cp {} assets/ \;
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
