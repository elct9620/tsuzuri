name: Release Assets

# Attaches what CI built for a release's commit, so nothing is compiled twice, then publishes the
# draft release-please left, so the latest release always carries the update manifest. Rerunning
# this replaces the assets; for a commit CI has not built, run CI on its tag first, then this.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach assets to, such as v0.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  target:
    # A pull request's run never builds a release, and its code is not trusted with write access.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      run-id: ${{ steps.release.outputs.run-id }}
    steps:
      - name: Find the release and the CI run that built it
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml --commit "$sha" -s success \
              --json databaseId -q '.[0].databaseId')"
            if [ -z "$run_id" ]; then
              echo "::error::no successful CI run built $tag ($sha); run CI on $tag first"
              exit 1
            fi
          else
            # release-please tags the commit that carries the new version.
            version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq .content |
              base64 -d | jq -er .version)"
            tag="v$version"
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)" || tagged=""
            if [ "$tagged" != "$RUN_SHA" ]; then
              echo "$RUN_SHA is not the commit $tag is tagged at; nothing to attach"
              exit 0
            fi
            run_id="$RUN_ID"
          fi
          { echo "tag=$tag"; echo "run-id=$run_id"; } >> "$GITHUB_OUTPUT"

  attach:
    needs: target
    if: needs.target.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      # release-please leaves the release a draft, which only a token that can write sees.
      - name: Find the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName -q .tagName
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          sparse-checkout: |
            components.json
            scripts/manifest.ts
            scripts/signatures.ts
            src-tauri/Cargo.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tsuzuri-*
          path: bundles
          run-id: ${{ needs.target.outputs.run-id }}
          github-token: ${{ github.token }}
      # Installers, and the macOS app archive only the updater installs, each package with its
      # updater signature; no executable reaches users loose.
      - name: Collect the installers
        run: |
          mkdir assets
          find bundles -type f \( -path '*/nsis/*.exe' -o -path '*/msi/*.msi' -o -path '*/dmg/*.dmg' \
            -o -path '*/deb/*.deb' -o -path '*/rpm/*.rpm' -o -path '*/macos/*.app.tar.gz' \
            -o -name '*.sig' \) -exec cp {} assets/ \;
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # An installed Tsuzuri reads this from the latest release to find its App Update.
      - name: Write the update manifest
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: node scripts/manifest.ts "$TAG" assets
      - name: Read the ffmpeg source pin
        id: ffmpeg
        run: |
          url="$(jq -er .ffmpeg.source components.json)"
          sha256="$(jq -er .ffmpeg.sha256 components.json)"
          { echo "url=$url"; echo "archive=${url##*/}"; echo "sha256=$sha256"; } >> "$GITHUB_OUTPUT"
      # Fetched once per pin: every later release, and every rerun, reuses the cached archive.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ffmpeg-source
          key: ffmpeg-source-${{ steps.ffmpeg.outputs.sha256 }}
      # The bundled ffmpeg is LGPL, so each release carries the source it was built from.
      - name: Collect the ffmpeg source
        env:
          URL: ${{ steps.ffmpeg.outputs.url }}
          ARCHIVE: ffmpeg-source/${{ steps.ffmpeg.outputs.archive }}
          SHA256: ${{ steps.ffmpeg.outputs.sha256 }}
        run: |
          if [ ! -f "$ARCHIVE" ]; then
            mkdir -p ffmpeg-source
            curl -fsSL -o "$ARCHIVE" "$URL"
          fi
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          cp "$ARCHIVE" assets/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ffmpeg-source
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: List the checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
      # Published only now, so the latest release never lacks the manifest installed apps read.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
