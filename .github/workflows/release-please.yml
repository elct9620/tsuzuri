name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # A release made with GITHUB_TOKEN triggers no other workflow, so its builds run here,
  # from the commit it is tagged at.
  crate-licenses:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/crate-licenses

  build:
    needs: [release-please, crate-licenses]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  attach:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tsuzuri-*
          path: bundles
      # Installers only, so no executable reaches users loose or inside a zip.
      - name: Attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir assets
          find bundles -type f \( -path '*/nsis/*.exe' -o -path '*/msi/*.msi' -o -path '*/dmg/*.dmg' \
            -o -path '*/deb/*.deb' -o -path '*/rpm/*.rpm' \) -exec cp {} assets/ \;
          ls assets
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY"
