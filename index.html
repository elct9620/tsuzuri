<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsuzuri</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header>
        <h1>Tsuzuri</h1>
      </header>

      <section class="panel" aria-labelledby="components-title" data-controller="components">
        <h2 id="components-title">執行環境</h2>
        <ul class="components">
          <li>ffmpeg <span class="status" data-components-target="status" data-component="ffmpeg">檢查中</span></li>
          <li>whisper.cpp <span class="status" data-components-target="status" data-component="whisper">檢查中</span></li>
          <li>llama.cpp <span class="status" data-components-target="status" data-component="llama">檢查中</span></li>
        </ul>
      </section>

      <section class="panel" aria-labelledby="models-title" data-controller="models">
        <h2 id="models-title">模型</h2>
        <dl class="models">
          <dt>轉錄</dt>
          <dd>
            <span data-models-target="status" data-slot="transcription">尚未指定</span>
            <button type="button" data-slot="transcription" data-action="models#choose">指定檔案</button>
          </dd>
          <dt>翻譯</dt>
          <dd>
            <span data-models-target="status" data-slot="translation">尚未指定</span>
            <button type="button" data-slot="translation" data-action="models#choose">指定檔案</button>
          </dd>
        </dl>
      </section>

      <section class="panel" aria-labelledby="work-title" data-controller="mode-tabs">
        <h2 id="work-title">工作</h2>
        <div class="mode-tabs" role="tablist">
          <button type="button" role="tab" data-mode="transcribe" data-mode-tabs-target="tab" data-action="mode-tabs#select" aria-selected="true">轉錄</button>
          <button type="button" role="tab" data-mode="translate" data-mode-tabs-target="tab" data-action="mode-tabs#select" aria-selected="false">翻譯</button>
          <button type="button" role="tab" data-mode="transcribe-and-translate" data-mode-tabs-target="tab" data-action="mode-tabs#select" aria-selected="false">轉錄後翻譯</button>
        </div>
        <div class="mode-panel" role="tabpanel" data-mode="transcribe" data-mode-tabs-target="panel" data-controller="transcribe">
          <p>拖入影片或音訊，或 <button type="button" data-action="transcribe#choose">選擇檔案</button></p>
          <p class="progress" data-transcribe-target="status"></p>
        </div>
        <div class="mode-panel" role="tabpanel" data-mode="translate" data-mode-tabs-target="panel" hidden>拖入 SRT 字幕檔</div>
        <div class="mode-panel" role="tabpanel" data-mode="transcribe-and-translate" data-mode-tabs-target="panel" hidden>拖入影片或音訊</div>
      </section>

      <section class="panel" aria-labelledby="transcript-title" data-controller="transcript" data-action="transcribe:loaded@window->transcript#show">
        <h2 id="transcript-title">字幕</h2>
        <p class="empty" data-transcript-target="empty">尚無內容</p>
        <ol class="segments" data-transcript-target="list"></ol>
      </section>

      <footer>使用 FFmpeg（LGPL）</footer>
    </main>
  </body>
</html>
