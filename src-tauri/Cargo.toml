[package]
name = "tsuzuri"
version = "0.1.0"
description = "Local transcription, subtitle editing and translation"
authors = ["Aotokitsuruya <contact@aotoki.me>"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsuzuri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-os = "2"
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "rustls"] }
csv = "1.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
