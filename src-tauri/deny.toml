# Licenses a dependency compiled into Tsuzuri may carry. Anything else fails
# `cargo deny check licenses` until it is reviewed and added here.
[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: unmodified sources only need their notice kept.
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
